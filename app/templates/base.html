<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel - Flecha Veloz</title>
    
    <!-- Importando fuentes elegantes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
    /* =========================================================
       PALETA DE COLORES Y ESTILOS GLOBALES
       ========================================================= */
    :root {
        --bg-primary: #f3f4f6; 
        --bg-panel: #ffffff; 
        --text-main: #111827; 
        --text-muted: #6b7280; 
        --accent-color: #000000; 
        --border-color: #e5e7eb; 
    }

    *, *::before, *::after {
        box-sizing: border-box;
    }

    html, body {
        max-width: 100%;
        overflow-x: hidden;
    }

    body { 
        margin: 0; 
        padding: 0; 
        display: flex; 
        flex-direction: column; 
        min-height: 100vh; 
        background-color: var(--bg-primary); 
        font-family: 'Inter', sans-serif; 
        color: var(--text-main);
    }

    h1, h2, h3 {
        font-family: 'Montserrat', sans-serif;
    }

    /* =========================================================
       BARRA DE NAVEGACIÓN SUPERIOR
       ========================================================= */
    .navbar {
        height: 70px; 
        background-color: var(--bg-panel); 
        border-bottom: 1px solid var(--border-color); 
        display: flex; 
        align-items: center; 
        justify-content: space-between; 
        padding: 0 32px; 
        position: sticky; 
        top: 0; 
        z-index: 1000; 
    }

    .nav-left { 
        display: flex; 
        align-items: center; 
        gap: 40px; 
    }
    
    .navbar-logo { 
        height: 45px; 
        width: auto;
        cursor: pointer; 
        object-fit: contain;
    } 
    
    .nav-links { 
        display: flex; 
        gap: 24px; 
    }
    
    .nav-item {
        color: var(--text-muted); 
        text-decoration: none; 
        font-weight: 500; 
        font-size: 14px; 
        padding: 8px 0;
        transition: color 0.2s; 
    }
    
    .nav-item:hover, .nav-item.active { 
        color: var(--accent-color); 
    }

    /* =========================================================
       MENÚ DE PERFIL Y DROPDOWN
       ========================================================= */
    .profile-container { position: relative; cursor: pointer; }
    .profile-trigger { display: flex; align-items: center; gap: 12px; }
    
    .profile-avatar {
        background-color: var(--accent-color);
        color: white;
        width: 36px; 
        height: 36px;
        border-radius: 50%; 
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: 600;
        font-size: 13px;
        overflow: hidden;
        flex-shrink: 0;
    }

    .profile-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .dropdown-menu {
        display: none; 
        position: absolute; 
        right: 0; 
        top: 50px; 
        background-color: var(--bg-panel);
        border: 1px solid var(--border-color);
        border-radius: 8px; 
        width: 220px;
        box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); 
        z-index: 1000;
        overflow: hidden;
    }
    
    .dropdown-header { padding: 16px; border-bottom: 1px solid var(--border-color); background-color: #fafafa; }
    
    .dropdown-item {
        display: block;
        padding: 12px 16px;
        color: var(--text-main);
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        transition: background 0.2s;
    }
    
    .dropdown-item:hover { 
        background-color: var(--bg-primary); 
    }

    .content-area { 
        padding: 40px 30px; 
        max-width: 1200px; 
        margin: 0 auto; 
        width: 100%; 
        flex: 1; 
        box-sizing: border-box; 
    }

    /* =========================================================
       MOTOR DE ALERTAS FLOTANTES (TOAST NOTIFICATIONS)
       ========================================================= */
    .toast-container {
        position: fixed;
        top: 25px;
        right: 25px;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        gap: 12px;
        pointer-events: none;
    }

    .toast-msg {
        background: rgba(15, 15, 15, 0.88);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #ffffff;
        padding: 16px 22px;
        border-radius: 12px;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 14px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        animation: toastSlideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), toastFadeOut 0.4s ease 3.5s forwards;
    }

    .toast-success { border-left: 4px solid #10b981; }
    .toast-error   { border-left: 4px solid #ef4444; }
    .toast-info    { border-left: 4px solid #3b82f6; }
    .toast-warning { border-left: 4px solid #f59e0b; }

    @keyframes toastSlideIn {
        from { transform: translateX(120%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }

    @keyframes toastFadeOut {
        to { opacity: 0; transform: translateY(-15px) scale(0.95); }
    }
    </style>
</head>
<body>
    
    <!-- BARRA SUPERIOR -->
    <header class="navbar">
        <div class="nav-left">
            <img src="/static/img/logo.png" alt="Logo Flecha Veloz" class="navbar-logo" onclick="window.location.href='/dashboard'">
            <nav class="nav-links">
                <a href="/dashboard" class="nav-item">Inicio</a>
                
                <!-- Botones con ID para filtrarlos por Rol -->
                <a href="/registro_chofer" class="nav-item" id="menu-registro">Registrar Chofer</a>
                <a href="/panel_chofer" class="nav-item" id="menu-panel">Panel Chofer</a>
                <a href="/central" class="nav-item" id="menu-central">Central Operativa</a>
                <a href="/registro_cliente" class="nav-item" id="menu-registro-cliente">Registrar Cliente</a>
                <a href="/reportes" class="nav-item" id="menu-reportes">Reportes</a>
            </nav>
        </div>

        <div class="profile-container" id="profileBtn">
            <div class="profile-trigger">
                <div class="profile-text-box" style="text-align: right; line-height: 1.2;">
                    <span id="ui-nombre" style="display: block; font-weight: 600; font-size: 14px; color: var(--text-main);">Cargando...</span>
                    <span id="ui-rol" style="font-size: 12px; color: var(--text-muted);">...</span>
                </div>
                <div id="ui-iniciales" class="profile-avatar">--</div>
            </div>

            <div class="dropdown-menu" id="dropdownMenu">
                <div class="dropdown-header">
                    <div id="ui-nombre-menu" style="font-weight: 600; font-size: 14px; color: #111827;">Cargando...</div>
                    <div id="ui-correo" style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">...</div>
                </div>
                <a href="/ajustes" class="dropdown-item">Ajustes de cuenta</a>
                <a href="#" class="dropdown-item" id="btn-logout" style="border-top: 1px solid var(--border-color); color: #dc2626;">Cerrar Sesión</a>
            </div>
        </div>
    </header>

    <!-- ÁREA CENTRAL DONDE CARGAN LAS DEMÁS VISTAS -->
    <main class="content-area">
        {% block content %}
        {% endblock %}
    </main>

    <!-- =========================================================
         MOTOR GLOBAL DE ADAPTACIÓN MÓVIL (100% TRANSPARENTE)
         ========================================================= -->
    <style>
        @media (max-width: 850px) {
            html, body {
                width: 100% !important;
                max-width: 100vw !important;
                overflow-x: hidden !important;
                position: relative;
            }

            /* 1. Barra de navegación 100% transparente que deja pasar el fondo */
            .navbar {
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                right: 0 !important;
                height: auto !important;
                padding: 14px 18px !important;
                flex-wrap: wrap !important;
                gap: 6px !important;
                background: transparent !important;
                background-color: transparent !important;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                border-bottom: none !important;
                box-shadow: none !important;
            }

            .nav-left {
                width: 100% !important;
                flex-direction: column !important;
                align-items: flex-start !important;
                gap: 8px !important;
            }

            .navbar-logo {
                height: 36px !important;
                filter: invert(1) brightness(100) !important;
            }

            /* Avatar arriba a la derecha sin romper el ancho */
            .profile-container {
                position: absolute !important;
                top: 14px !important;
                right: 18px !important;
            }

            .profile-text-box {
                display: none !important;
            }

            #ui-iniciales {
                background-color: #ffffff !important;
                color: #000000 !important;
                width: 34px !important;
                height: 34px !important;
            }

            /* Enlaces de texto limpios y transparentes sobre la imagen de fondo */
            .nav-links {
                width: 100% !important;
                display: flex !important;
                gap: 18px !important;
                overflow-x: auto !important;
                padding: 4px 0 !important;
                border-top: none !important;
                background: transparent !important;
                scrollbar-width: none !important;
                -ms-overflow-style: none !important;
            }

            .nav-links::-webkit-scrollbar {
                display: none !important;
            }

            .nav-item {
                white-space: nowrap !important;
                font-size: 13px !important;
                font-weight: 500 !important;
                padding: 4px 0 !important;
                background: transparent !important;
                border: none !important;
                border-radius: 0 !important;
                color: rgba(255, 255, 255, 0.85) !important;
            }

            .nav-item:hover, .nav-item.active {
                color: #ffffff !important;
            }

            /* 2. El fondo de las vistas sube hasta el borde superior (detrás del navbar) */
            .content-area {
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                overflow-x: hidden !important;
            }

            .dashboard-page,
            .central-page,
            .chofer-page,
            .ajustes-page {
                width: 100% !important;
                max-width: 100% !important;
                margin-left: 0 !important;
                margin-right: 0 !important;
                margin-top: 0 !important;
                padding-top: 110px !important;
                padding-bottom: 45px !important;
                background-attachment: scroll !important;
                overflow-x: hidden !important;
            }

            .dashboard-container,
            .central-container,
            .panel-container,
            .ajustes-container {
                width: 100% !important;
                max-width: 100% !important;
                padding-left: 15px !important;
                padding-right: 15px !important;
                margin-left: 0 !important;
                margin-right: 0 !important;
                box-sizing: border-box !important;
            }

            /* 3. Modales y Alertas encuadrados en móvil */
            .modal-oculto {
                padding: 12px !important;
            }

            .modal-contenido,
            .modal-contenido-retiro,
            .modal-contenido-agenda,
            .modal-contenido-amplio {
                width: 100% !important;
                max-width: 100% !important;
                padding: 20px 16px !important;
                border-radius: 16px !important;
            }

            .toast-container {
                top: 12px !important;
                right: 12px !important;
                left: 12px !important;
            }

            .toast-msg {
                width: 100% !important;
                font-size: 13px !important;
                padding: 14px 16px !important;
            }
        }
    </style>

    <!-- =========================================================
         LÓGICA DEL SISTEMA (3 ROLES ESTRICTOS Y FOTO DE PERFIL)
         ========================================================= -->
    <script>
        // 1. Desplegar el menú del perfil al hacer clic
        document.addEventListener('click', function(event) {
            const profileBtn = document.getElementById('profileBtn');
            const dropdown = document.getElementById('dropdownMenu');
            if (profileBtn && profileBtn.contains(event.target)) {
                dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
            } else if (dropdown) {
                dropdown.style.display = 'none';
            }
        });

        // 2. Inyectar datos y aplicar reglas de seguridad por Rol
        window.addEventListener('DOMContentLoaded', () => {
            const idUsuario = localStorage.getItem('id_usuario');
            const nombre = localStorage.getItem('usuarioNombre');
            const correo = localStorage.getItem('usuarioCorreo');
            const rol = localStorage.getItem('usuarioRol') || '';
            const idRol = String(localStorage.getItem('id_rol')); 
            const rutaActual = window.location.pathname;

            if (!nombre) {
                window.location.href = "/";
                return;
            }

            // ========================================================
            // 🚨 A. GUARDIÁN DE RUTAS POR ROL
            // ========================================================
            const rutasExclusivasGerente = ['/reportes', '/registro_chofer'];
            const rutasOperativasAdmin   = ['/central', '/registro_cliente'];
            const rutasExclusivasChofer  = ['/panel_chofer'];

            if (idRol === "3" && (rutasExclusivasGerente.includes(rutaActual) || rutasOperativasAdmin.includes(rutaActual))) {
                window.location.replace('/panel_chofer');
                return;
            }

            if (idRol === "2" && (rutasExclusivasGerente.includes(rutaActual) || rutasExclusivasChofer.includes(rutaActual))) {
                window.location.replace('/central');
                return;
            }

            if (idRol === "1" && rutasExclusivasChofer.includes(rutaActual)) {
                window.location.replace('/dashboard');
                return;
            }

            // ========================================================
            // 👤 B. PINTAR DATOS Y FOTO DE PERFIL DEL USUARIO
            // ========================================================
            document.getElementById('ui-nombre').textContent = nombre;
            document.getElementById('ui-nombre-menu').textContent = nombre;
            document.getElementById('ui-correo').textContent = correo;
            document.getElementById('ui-rol').textContent = rol;

            const palabras = nombre.trim().split(" ");
            let iniciales = palabras[0].charAt(0);
            if (palabras.length > 1) {
                iniciales += palabras[1].charAt(0);
            }

            const avatarNavbar = document.getElementById('ui-iniciales');
            const fotoGuardada = idUsuario ? localStorage.getItem(`fv_foto_usuario_${idUsuario}`) : null;
            if (fotoGuardada && avatarNavbar) {
                avatarNavbar.innerHTML = `<img src="${fotoGuardada}" alt="Perfil">`;
            } else if (avatarNavbar) {
                avatarNavbar.textContent = iniciales.toUpperCase();
            }

            const saludo = document.getElementById('saludo-dashboard');
            if (saludo) {
                saludo.textContent = "Hola de nuevo, " + palabras[0];
            }

            // ========================================================
            // 🛡️ C. FILTRO VISUAL ESTRICTO POR ROLES
            // ========================================================
            const menuRegistroChofer  = document.getElementById('menu-registro');
            const menuPanelChofer     = document.getElementById('menu-panel');
            const menuReportes        = document.getElementById('menu-reportes');
            const menuCentral         = document.getElementById('menu-central');
            const menuRegistroCliente = document.getElementById('menu-registro-cliente');

            if (idRol === "1") {
                // ROL 1: GERENTE
                if (menuRegistroChofer)  menuRegistroChofer.style.display = "block";
                if (menuReportes)        menuReportes.style.display = "block";
                if (menuCentral)         menuCentral.style.display = "block"; 
                if (menuRegistroCliente) menuRegistroCliente.style.display = "block";
                if (menuPanelChofer)     menuPanelChofer.style.display = "none"; 

            } else if (idRol === "2") {
                // ROL 2: ADMINISTRATIVO
                if (menuRegistroChofer)  menuRegistroChofer.style.display = "none";
                if (menuReportes)        menuReportes.style.display = "none";
                if (menuCentral)         menuCentral.style.display = "block"; 
                if (menuRegistroCliente) menuRegistroCliente.style.display = "block";
                if (menuPanelChofer)     menuPanelChofer.style.display = "none"; 

                document.querySelectorAll('a, button').forEach(el => {
                    const href = (el.getAttribute('href') || '').toLowerCase();
                    const texto = (el.innerText || '').toLowerCase();
                    if (
                        href.includes('/registro_chofer') || 
                        href.includes('/reportes') || 
                        texto.includes('registrar chofer') ||
                        texto.includes('ver reportes') ||
                        texto.includes('empezar a operar')
                    ) {
                        el.style.display = 'none';
                    }
                });

            } else if (idRol === "3") { 
                // ROL 3: CHOFER
                if (menuRegistroChofer)  menuRegistroChofer.style.display = "none";
                if (menuReportes)        menuReportes.style.display = "none";
                if (menuCentral)         menuCentral.style.display = "none"; 
                if (menuRegistroCliente) menuRegistroCliente.style.display = "none";
                if (menuPanelChofer)     menuPanelChofer.style.display = "block"; 

                document.querySelectorAll('a, button').forEach(el => {
                    const href = (el.getAttribute('href') || '').toLowerCase();
                    const texto = (el.innerText || '').toLowerCase();
                    if (
                        href.includes('/registro_chofer') || 
                        href.includes('/reportes') || 
                        href.includes('/registro_cliente') || 
                        href.includes('/central') ||
                        texto.includes('registrar chofer') ||
                        texto.includes('ver reportes') ||
                        texto.includes('registrar cliente') ||
                        texto.includes('empezar a operar')
                    ) {
                        el.style.display = 'none';
                    }
                });
            }
        });

        // 3. Destruir la sesión correctamente
        const btnLogout = document.getElementById('btn-logout');
        if (btnLogout) {
            btnLogout.addEventListener('click', function(e) {
                e.preventDefault(); 
                localStorage.removeItem('id_usuario');
                localStorage.removeItem('id_rol');
                localStorage.removeItem('usuarioNombre');
                localStorage.removeItem('usuarioCorreo');
                localStorage.removeItem('usuarioRol');
                window.location.href = "/"; 
            });
        }

        /* =========================================================
           MOTOR JAVASCRIPT DE NOTIFICACIONES (TOASTS)
           ========================================================= */
        function notificar(mensaje, tipo = 'info') {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                container.className = 'toast-container';
                document.body.appendChild(container);
            }

            const toast = document.createElement('div');
            toast.className = `toast-msg toast-${tipo}`;

            let icono = '';
            if (tipo === 'success') {
                icono = '<svg width="22" height="22" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>';
            } else if (tipo === 'error') {
                icono = '<svg width="22" height="22" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>';
            } else if (tipo === 'warning') {
                icono = '<svg width="22" height="22" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>';
            } else {
                icono = '<svg width="22" height="22" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>';
            }

            toast.innerHTML = `${icono} <span>${mensaje}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                if (toast.parentNode) {
                    toast.parentNode.removeChild(toast);
                }
            }, 3900);
        }
    </script>
</body>
</html>
